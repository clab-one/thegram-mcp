name: Validate shared memory skill
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  semantic-fixtures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m unittest discover -s tests -p 'test_*.py' -v
